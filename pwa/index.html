<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reparto — Farmacia Peñalolén</title>
  <meta
    name="description"
    content="Aplicación de reparto para conductores: estados de entrega con un toque y tiempo estimado de llegada."
  />
  <meta name="theme-color" content="#0f766e" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --teal: #0f766e;
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #0f172a;
      --line: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
    }
    .cabecera {
      background: var(--teal);
      color: #ffffff;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .cabecera h1 { margin: 0; font-size: 1.15rem; line-height: 1.3; }
    .banner {
      margin: 8px 0 0;
      font-size: 0.85rem;
      line-height: 1.4;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.16);
    }
    .banner[data-estado="ok"] { background: #dcfce7; color: #14532d; }
    .banner[data-estado="warn"] { background: #fef3c7; color: #92400e; }
    .banner[data-estado="error"] { background: #fee2e2; color: #991b1b; }
    .lista {
      list-style: none;
      margin: 0 auto;
      padding: 12px;
      display: grid;
      gap: 12px;
      max-width: 640px;
    }
    .tarjeta {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }
    .tarjeta .fila-superior {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .codigo { font-weight: 700; font-size: 0.95rem; margin: 0; }
    .cliente { margin: 4px 0 0; font-weight: 600; }
    .detalle { margin: 2px 0 0; font-size: 0.9rem; color: #475569; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .badge[data-estado="PENDIENTE"] { background: #fef9c3; color: #854d0e; }
    .badge[data-estado="EN_RUTA"] { background: #dbeafe; color: #1d4ed8; }
    .badge[data-estado="ENTREGADO"] { background: #dcfce7; color: #15803d; }
    .eta {
      margin: 8px 0 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
      min-height: 1.2em;
    }
    .acciones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      min-height: 44px;
      min-width: 44px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    button[disabled] { opacity: 0.45; cursor: not-allowed; }
    .btn-ruta { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; }
    .btn-entregado { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
    .btn-eta { background: #f1f5f9; color: #334155; border-color: var(--line); }
    .vacio {
      text-align: center;
      color: #64748b;
      padding: 24px 16px;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <header class="cabecera">
    <h1>Reparto — Farmacia Peñalolén</h1>
    <p id="banner" class="banner" role="status" aria-live="polite">Cargando reparto…</p>
  </header>

  <main>
    <h2 class="visually-hidden">Lista de entregas del día</h2>
    <ul id="lista-entregas" class="lista" aria-label="Lista de entregas del día"></ul>
    <p id="vacio" class="vacio" hidden>No hay entregas para mostrar.</p>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
