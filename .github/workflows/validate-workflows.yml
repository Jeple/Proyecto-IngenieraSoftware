name: Validate workflows

on:
  push:
    paths:
      - "workflows/**"
      - "scripts/**"
      - "pwa/**"
      - "docker-compose.yml"
      - ".github/workflows/validate-workflows.yml"
  pull_request:
    paths:
      - "workflows/**"
      - "scripts/**"
      - "pwa/**"
      - "docker-compose.yml"
      - ".github/workflows/validate-workflows.yml"

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Versión de Node fijada (control de configuración; las pruebas usan Node >= 18).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Escaneo de secretos y RUT (mismo script que se corre en local).
      - name: Check secrets
        run: bash scripts/check_secrets.sh

      # Dependency-free: uses only Node.js (preinstalled on ubuntu-latest).
      - name: Validate workflow JSON files
        run: |
          node -e '
            const fs = require("fs");
            const dir = "workflows";
            if (!fs.existsSync(dir)) {
              console.log("workflows/ directory not found; nothing to validate.");
              process.exit(0);
            }
            const files = fs.readdirSync(dir).filter((f) => f.endsWith(".json"));
            let invalid = false;
            for (const f of files) {
              const path = dir + "/" + f;
              const raw = fs.readFileSync(path, "utf8");
              // Windows editors may prepend a UTF-8 BOM, which JSON.parse rejects.
              if (raw.charCodeAt(0) === 0xfeff) {
                console.error("Invalid JSON in workflows/" + f + ": file starts with a UTF-8 BOM. Re-save as UTF-8 without BOM.");
                invalid = true;
                continue;
              }
              try {
                JSON.parse(raw);
                console.log("OK " + f);
              } catch (e) {
                console.error("Invalid JSON in workflows/" + f + ": " + e.message);
                invalid = true;
              }
            }
            if (invalid) process.exit(1);
          '

      # US-04: fuzzy stock/price lookup tests (Node >= 18, zero deps).
      # Exits 1 if any assertion fails.
      - name: Run US-04 fuzzy match tests
        run: node scripts/test-fuzzy-match.mjs

      # US-05: reservation tests + drift guard between the US-04 and US-05
      # fuzzy matcher copies (Node >= 18, zero deps). Exits 1 on failure.
      - name: Run US-05 reservation tests
        run: node scripts/test-reserva.mjs

      # US-06: delivery tracking by RUT or order code (RF-07).
      - name: Run US-06 tracking tests
        run: node scripts/test-trazabilidad.mjs

      # US-10: 12-hour recipe expiry cron (RF-06).
      - name: Run US-10 expiry cron tests
        run: node scripts/test-cron-expiracion.mjs

      # US-20: pharmacist approval of recipes (aprobar/rechazar over Telegram).
      - name: Run US-20 pharmacist approval tests
        run: node scripts/test-aprobacion.mjs

      # US-21: workflow failure alerts (Error Trigger -> Telegram admin).
      - name: Run US-21 alert tests
        run: node scripts/test-alertas.mjs

      # Panel de demostración: consistencia con los datos sintéticos del repo.
      - name: Run demo panel consistency test
        run: node scripts/test-panel.mjs

      # Mapa de workflows: consistencia con los JSON reales.
      - name: Run workflow map consistency test
        run: node scripts/test-mapa.mjs

      # US-11: driver PWA pure functions (no DOM emulation, zero deps).
      - name: Run US-11 driver PWA tests
        run: node pwa/test/pwa.test.mjs

      # US-09 / RF-05: recipe ingestion over Telegram (photo + #FAR-XXXX caption).
      - name: Run US-09 Telegram recipe tests
        run: node scripts/test-recetas-telegram.mjs

      # US-09 / RF-05: recipe ingestion over IMAP email (subject + #FAR-XXXX).
      - name: Run US-09 email recipe tests
        run: node scripts/test-recetas-email.mjs

      # US-17: router de intenciones + pruebas de contrato con US-04/05/06/20/22.
      - name: Run US-17 router tests
        run: node scripts/test-router.mjs

      # US-22: despacho marcado por el personal + aviso al farmacéutico (US-09).
      - name: Run US-22 dispatch tests
        run: node scripts/test-despacho.mjs

      # Reglas estáticas para n8n 2.44.2 real (env, expresiones, credenciales,
      # versiones de nodo, webhook único, imagen fijada).
      - name: Run n8n workflow convention tests
        run: node scripts/test-workflows-n8n.mjs

      - name: Warn when workflows/ has no JSON files yet
        run: |
          count=$(find workflows -maxdepth 1 -name '*.json' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::warning::workflows/ contains no JSON files yet. Export them from n8n as US-XX-<slug>.json."
          else
            echo "Found $count workflow JSON file(s)."
          fi

  # Integración con n8n REAL (misma imagen fijada) y Telegram simulado: importa y
  # publica los 9 flujos, envía updates al webhook único y verifica respuestas,
  # derivación a subflujos y alertas US-21. No usa credenciales reales.
  integracion-n8n:
    # Runner fijado (control de configuración). Desde el 19-oct-2026 «ubuntu-latest»
    # apunta a Ubuntu 26; las dos primeras corridas de este job (10-nov) se cortaron
    # por tiempo al levantar n8n allí, sin llegar a «n8n listo». 24.04 es la imagen LTS estable.
    runs-on: ubuntu-24.04
    needs: validate-json
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull n8n image
        run: |
          docker version --format 'Docker cliente {{.Client.Version}}, servidor {{.Server.Version}}'
          docker pull n8nio/n8n:2.44.2

      # Límite propio del paso: si se excede, el paso falla y el diagnóstico de abajo alcanza a correr.
      - name: Run integration test
        timeout-minutes: 15
        run: node scripts/local/prueba-integracion.mjs --n 20

      # Solo si falla o se corta: estado del contenedor, log de n8n y readiness.
      - name: Diagnóstico de n8n
        if: failure() || cancelled()
        run: |
          docker ps -a --filter name=farmacia-n8n-integracion
          docker logs --tail 80 farmacia-n8n-integracion 2>&1 || true
          curl -sS -m 5 -o /dev/null -w 'readiness: HTTP %{http_code}\n' http://127.0.0.1:5690/healthz/readiness || true
