<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1080" viewBox="0 0 1320 1080" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="flecha" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#C3C2B7" stroke-width="1.8"/>
    </marker>
    <style>
      text { font-family: Inter, sans-serif; fill: #1F1F1F; }
      .t { font-size: 27px; font-weight: 600; }
      .b { font-size: 21px; font-weight: 600; }
      .s { font-size: 17px; fill: #5E5D59; }
      .l { font-size: 17px; fill: #5E5D59; }
      .g { font-size: 16px; font-weight: 600; fill: #8A887F; letter-spacing: 0.4px; }
      .caja { fill: #FFFFFF; stroke: #C3C2B7; stroke-width: 2; }
      .azul { fill: #E5EFFA; stroke: #2A78D6; stroke-width: 3; }
      .opc { fill: #FFFFFF; stroke: #C3C2B7; stroke-width: 2; stroke-dasharray: 7 6; }
      .srv { fill: #FAFAF7; stroke: #8A887F; stroke-width: 2; }
      .dock { fill: none; stroke: #C3C2B7; stroke-width: 2; stroke-dasharray: 7 6; }
      .nota { fill: #EDEDEC; stroke: #C3C2B7; stroke-width: 2; stroke-dasharray: 7 6; }
      .f { fill: none; stroke: #C3C2B7; stroke-width: 2; marker-end: url(#flecha); }
      .fd { fill: none; stroke: #C3C2B7; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#flecha); }
    </style>
  </defs>

  <text class="t" x="42" y="52">Dónde funciona la v0.1: un servidor encendido y servicios en la nube</text>

  <!-- Fila 1: teléfonos -->
  <rect class="caja" x="42" y="90" width="382" height="86" rx="12"/>
  <text class="b" x="233" y="128" text-anchor="middle">Teléfono del vecino</text>
  <text class="s" x="233" y="156" text-anchor="middle">app de Telegram</text>
  <rect class="caja" x="469" y="90" width="382" height="86" rx="12"/>
  <text class="b" x="660" y="128" text-anchor="middle">Teléfono del químico farmacéutico</text>
  <text class="s" x="660" y="156" text-anchor="middle">app de Telegram, chat autorizado</text>
  <rect class="caja" x="896" y="90" width="382" height="86" rx="12"/>
  <text class="b" x="1087" y="128" text-anchor="middle">Teléfono del personal</text>
  <text class="s" x="1087" y="156" text-anchor="middle">app de Telegram, chat autorizado</text>
  <path class="f" d="M233,176 V226"/>
  <path class="f" d="M660,176 V226"/>
  <path class="f" d="M1087,176 V226"/>

  <!-- Fila 2: Telegram -->
  <rect class="caja" x="42" y="228" width="1236" height="68" rx="12"/>
  <text class="b" x="660" y="270" text-anchor="middle">Servidores de Telegram (nube)</text>

  <!-- Servidor -->
  <rect class="srv" x="42" y="470" width="1236" height="330" rx="14"/>
  <text class="b" x="1254" y="502" text-anchor="end">Servidor de la v0.1</text>
  <text class="s" x="1254" y="527" text-anchor="end">máquina virtual en la nube o computador siempre encendido</text>

  <rect class="dock" x="66" y="545" width="940" height="225" rx="12"/>
  <text class="g" x="86" y="572">DOCKER</text>

  <!-- Fila 3: Cloudflare y GitHub -->
  <path class="f" d="M211,296 V346"/>
  <rect class="caja" x="86" y="348" width="250" height="76" rx="12"/>
  <text class="b" x="211" y="381" text-anchor="middle">Cloudflare</text>
  <text class="s" x="211" y="407" text-anchor="middle">dirección pública del bot</text>

  <rect class="caja" x="896" y="348" width="382" height="76" rx="12"/>
  <text class="b" x="1087" y="381" text-anchor="middle">GitHub</text>
  <text class="s" x="1087" y="407" text-anchor="middle">código, pruebas y versión v0.1.0</text>
  <path class="fd" d="M1144,424 V468"/>
  <text class="l" x="1132" y="452" text-anchor="end">se instala desde aquí</text>

  <path class="f" d="M211,424 V593"/>
  <text class="l" x="225" y="452">túnel que sale del servidor</text>

  <path class="f" d="M546,593 V298"/>
  <text class="l" x="558" y="452">respuestas y avisos</text>

  <rect class="caja" x="86" y="595" width="250" height="140" rx="12"/>
  <text class="b" x="211" y="652" text-anchor="middle">Túnel de Cloudflare</text>
  <text class="s" x="211" y="680" text-anchor="middle">no abre puertos</text>

  <path class="f" d="M336,665 H384"/>
  <rect class="azul" x="386" y="595" width="320" height="140" rx="12"/>
  <text class="b" x="546" y="652" text-anchor="middle">Asistente v0.1 en n8n</text>
  <text class="s" x="546" y="680" text-anchor="middle">router + 8 flujos</text>

  <path class="f" d="M706,665 H754"/>
  <rect class="caja" x="756" y="595" width="230" height="140" rx="12"/>
  <text class="b" x="871" y="652" text-anchor="middle">Historial</text>
  <text class="s" x="871" y="680" text-anchor="middle">se borra a los 7 días</text>

  <rect class="caja" x="1030" y="595" width="228" height="140" rx="12"/>
  <text class="b" x="1144" y="652" text-anchor="middle">Claves</text>
  <text class="s" x="1144" y="680" text-anchor="middle">solo en el servidor,</text>
  <text class="s" x="1144" y="702" text-anchor="middle">nunca en GitHub</text>

  <!-- Fila 4: servicios de datos -->
  <path class="f" d="M420,735 V830 H233 V878"/>
  <text class="l" x="254" y="864">lee y escribe</text>
  <path class="f" d="M660,735 V878"/>
  <text class="l" x="678" y="864">guarda la foto</text>
  <path class="fd" d="M700,735 V830 H1087 V878"/>
  <text class="l" x="1105" y="864">mensaje ambiguo</text>

  <rect class="caja" x="42" y="880" width="382" height="86" rx="12"/>
  <text class="b" x="233" y="918" text-anchor="middle">Planilla de Google</text>
  <text class="s" x="233" y="946" text-anchor="middle">catálogo, pedidos y bitácora</text>
  <rect class="caja" x="469" y="880" width="382" height="86" rx="12"/>
  <text class="b" x="660" y="918" text-anchor="middle">Google Drive</text>
  <text class="s" x="660" y="946" text-anchor="middle">carpeta privada de recetas</text>
  <rect class="opc" x="896" y="880" width="382" height="86" rx="12"/>
  <text class="b" x="1087" y="918" text-anchor="middle">NVIDIA NIM (opcional)</text>
  <text class="s" x="1087" y="946" text-anchor="middle">solo clasifica el mensaje</text>

  <rect class="nota" x="42" y="998" width="1236" height="58" rx="12"/>
  <text class="s" x="660" y="1033" text-anchor="middle">Lo único público es la dirección de Cloudflare; el editor de n8n no queda expuesto a internet.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
