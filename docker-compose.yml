# Pila local del prototipo: n8n + túnel de Cloudflare (RNF-03; RNF-05: costo $0).
#
# Forma recomendada (un solo comando: crea .env, importa y publica los flujos,
# abre el túnel y registra el webhook del bot):
#   Windows (PowerShell):  powershell -ExecutionPolicy Bypass -File scripts/local/levantar.ps1
#   macOS / Linux / Git Bash:  bash scripts/local/levantar.sh
#
# Uso manual:
#   docker compose up -d n8n                          # solo n8n en http://localhost:5678
#   docker compose --profile tunel-rapido up -d       # + túnel rápido sin cuenta (*.trycloudflare.com)
#   docker compose --profile tunel-nombrado up -d     # + túnel con cuenta (CF_TUNNEL_TOKEN)
#
# Versiones fijadas (no usar latest): se cambian a propósito, en un PR, con la
# prueba de integración en verde (node scripts/local/prueba-integracion.mjs).

services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.44.2}
    container_name: farmacia-n8n
    restart: unless-stopped
    ports:
      # Solo localhost: el túnel llega a n8n por la red interna de compose.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    # Permite que las mediciones locales usen un proxy en el host (Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_PORT=5678
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Falta N8N_ENCRYPTION_KEY en .env (lo genera scripts/local/levantar)}
      - GENERIC_TIMEZONE=America/Santiago
      - TZ=America/Santiago
      # Los nodos leen la configuración con $env (en n8n 2.x no existe process.env).
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # RNF-04: una ejecución de producción a la vez. Cada mensaje del bot se
      # procesa completo (router + subflujo) antes del siguiente, de modo que
      # dos reservas simultáneas no pueden leer el mismo stock.
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=1
      # Privacidad (Ley 19.628): las ejecuciones guardan RUT y direcciones;
      # se borran solas a los 7 días.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Configuración del negocio (valores en .env; nunca se versionan).
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID:-}
      - GOOGLE_DRIVE_RECETAS_FOLDER_ID=${GOOGLE_DRIVE_RECETAS_FOLDER_ID:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_PHARMACIST_CHAT_IDS=${TELEGRAM_PHARMACIST_CHAT_IDS:-}
      - TELEGRAM_STAFF_CHAT_IDS=${TELEGRAM_STAFF_CHAT_IDS:-}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
      - TELEGRAM_API_BASE=${TELEGRAM_API_BASE:-https://api.telegram.org}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18

  # Túnel rápido: sin cuenta de Cloudflare. La URL https://*.trycloudflare.com
  # cambia en cada arranque; el script de arranque la lee y registra el webhook.
  cloudflared-rapido:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.1}
    container_name: farmacia-tunel-rapido
    profiles: ["tunel-rapido"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      n8n:
        condition: service_healthy

  # Túnel con nombre (requiere cuenta y CF_TUNNEL_TOKEN). Despliegue estable
  # con Cloudflare Access: ver docs/n8n-despliegue.md e infra/n8n/.
  cloudflared-nombrado:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.1}
    container_name: farmacia-tunel-nombrado
    profiles: ["tunel-nombrado"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:-}
    depends_on:
      n8n:
        condition: service_healthy

volumes:
  n8n_data:
